4679924"/></g><g><polyline data-points="1.25,6.25 1.25,1.25" data-type="line" data-label="" points="81.0858311330019,249.5925523284028 81.0858311330019,568.1447774844003" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="9.556566754679924"/></g><g><polyline data-points="1.25,1.25 1,1" data-type="line" data-label="" points="81.0858311330019,568.1447774844003 65.15821987520204,584.0723887422001" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="9.556566754679924"/></g><g><rect data-type="rect" data-label="" data-x="5" data-y="5" x="256.28955496880053" y="265.52016358620267" width="127.42089006239894" height="127.42089006239894" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015696013416799905"/></g><g><rect data-type="rect" data-label="" data-x="1" data-y="1" x="49.230608617402154" y="568.1447774844003" width="31.85522251559975" height="31.855222515599735" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015696013416799905"/></g><g><rect data-type="rect" data-label="" data-x="9" data-y="9" x="558.9141688669981" y="58.46121723480428" width="31.855222515599735" height="31.855222515599735" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015696013416799905"/></g><g><rect data-type="rect" data-label="" data-x="1" data-y="9" x="49.230608617402154" y="58.46121723480428" width="31.85522251559975" height="31.855222515599735" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015696013416799905"/></g><g><rect data-type="rect" data-label="" data-x="9" data-y="1" x="558.9141688669981" y="568.1447774844003" width="31.855222515599735" height="31.855222515599735" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015696013416799905"/></g><g><rect data-type="rect" data-label="" data-x="4" data-y="1" x="240.36194371100063" y="568.1447774844003" width="31.855222515599763" height="31.855222515599735" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015696013416799905"/></g><circle data-type="circle" data-label="" data-x="6.25" data-y="8.75" cx="399.63805628899934" cy="90.31643975040402" r="19.113133509359848" fill="blue" stroke="none" stroke-width="0.015696013416799905"/><circle data-type="circle" data-label="" data-x="1.25" data-y="6.25" cx="81.0858311330019" cy="249.5925523284028" r="19.113133509359848" fill="blue" stroke="none" stroke-width="0.015696013416799905"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.71044503119949,"c":0,"e":1.447774844002538,"b":0,"d":-63.71044503119949,"f":647.7828337733996};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>